[versions]
agp = "9.3.1"
kotlin = "2.3.20"
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
playServicesAds = "25.4.0"
userMessagingPlatform = "4.0.0"
billing = "9.1.0"
lifecycleRuntimeKtx = "2.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
